name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SCP source code to server (bypass unreliable git on server)
      - name: Sync code
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/,frontend/,docker-compose.prod.yml"
          target: ~/blog
          overwrite: true

      - name: Build & restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/blog

            docker compose --env-file .env.prod -f docker-compose.prod.yml build backend frontend
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans

            sleep 3
            docker compose -f docker-compose.prod.yml ps
            docker image prune -f

            echo "✅ Blog deploy complete"
