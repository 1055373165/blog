name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual trigger

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/blog-frontend
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/blog-backend

jobs:
  # ── Build Docker images in parallel ────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to production server ────────────────────────
  deploy:
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    steps:
      # SSH and restart services with pre-built GHCR images
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}:latest
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}:latest
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: FRONTEND_IMAGE,BACKEND_IMAGE
          script: |
            set -e

            cd ~/blog

            # Login to GHCR
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # Pull pre-built images
            docker pull "${FRONTEND_IMAGE}"
            docker pull "${BACKEND_IMAGE}"

            # Create a temporary compose override to inject GHCR images
            # This way docker-compose.prod.yml stays untouched for manual deploys
            cat > docker-compose.cicd.yml <<OVERRIDE
            services:
              backend:
                image: ${BACKEND_IMAGE}
              frontend:
                image: ${FRONTEND_IMAGE}
            OVERRIDE
            sed -i 's/^            //' docker-compose.cicd.yml

            # Restart with override (original compose + GHCR image override)
            docker compose --env-file .env.prod \
              -f docker-compose.prod.yml \
              -f docker-compose.cicd.yml \
              up -d --no-build --remove-orphans

            # Health check
            sleep 5
            docker compose -f docker-compose.prod.yml ps

            # Cleanup
            rm -f docker-compose.cicd.yml
            docker image prune -f

            echo "✅ Deploy complete"
